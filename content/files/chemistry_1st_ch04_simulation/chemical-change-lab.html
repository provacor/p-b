<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>রাসায়নিক পরিবর্তন ল্যাব — ৪র্থ অধ্যায়ের সিমুলেশন</title>
<style>
  :root {
    --bg: #0d1017; --panel: #151a24; --panel2: #1c2230; --line: #2a3242; --text: #e9edf4; --muted: #8e98ab;
    --a: #7ea6ff; --b: #f7c35c; --c: #4fd8c4; --d: #fb8fb0; --e: #6ee7a0; --grid: rgba(255,255,255,.06);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6fa; --panel: #fff; --panel2: #f1f4f9; --line: #dde3ec; --text: #0f172a; --muted: #5b6577;
      --a: #3b6cf6; --b: #c58a06; --c: #0f9f8e; --d: #e2457a; --e: #16a34a; --grid: rgba(15,23,42,.07); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Noto Sans Bengali", "Inter", system-ui, sans-serif; }
  header { padding: 14px 14px 6px; }
  h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .82rem; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px; scrollbar-width: none; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 99px; padding: 7px 12px; font: inherit; font-size: .82rem; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--a); border-color: transparent; color: #fff; }
  main { padding: 6px 14px 24px; max-width: 900px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  h2 { margin: 2px 0 2px; font-size: 1.05rem; }
  .sub { color: var(--muted); font-size: .82rem; margin: 0 0 10px; }
  canvas { width: 100%; height: 260px; display: block; background: var(--panel2); border-radius: 12px; touch-action: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .row button { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 10px; padding: 7px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
  .row button.on { border-color: var(--a); color: var(--a); }
  .ctl { display: grid; gap: 8px; margin-top: 10px; }
  .ctl label { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .84rem; }
  .ctl label b { color: var(--a); font-variant-numeric: tabular-nums; }
  .ctl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--a); }
  .info { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel2); font-size: .86rem; }
  .info code { font-family: ui-monospace, monospace; color: var(--c); }
  .info .big { font-size: 1.05rem; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .78rem; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .note { font-size: .78rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>রাসায়নিক পরিবর্তন ল্যাব</h1>
  <p>রসায়ন ১ম পত্র · ৪র্থ অধ্যায় (রাসায়নিক পরিবর্তন) — নোটের সূত্র ও পরীক্ষাগুলোর হাতে-কলমে সিমুলেশন। স্লাইডার আর বোতাম বদলে দেখো কী হয়।</p>
</header>
<nav class="tabs" id="tabs"></nav>
<main><section class="card">
  <h2 id="title"></h2>
  <p class="sub" id="sub"></p>
  <canvas id="cv"></canvas>
  <div class="legend" id="legend"></div>
  <div class="row" id="buttons"></div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
  <p class="note" id="note"></p>
</section></main>

<script>
(() => {
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const bn = (x, d = 2) => {
    const s = typeof x === 'number' ? (Number.isInteger(x) ? String(x) : x.toFixed(d)) : String(x);
    return s.replace(/\d/g, (c) => '০১২৩৪৫৬৭৮৯'[c]);
  };
  const TAU = Math.PI * 2;

  // ---------- drawing helpers ----------
  function grid(w, h, midY = h / 2) {
    ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = midY % 40; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    ctx.strokeStyle = css('--line'); ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(w, midY); ctx.stroke();
  }
  function curve(fn, x0, x1, color, width = 2.4, step = 2) {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
    for (let x = x0; x <= x1; x += step) { const y = fn(x); x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
  function dot(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function text(s, x, y, color = css('--muted'), size = 12, align = 'left') {
    ctx.fillStyle = color; ctx.font = `${size}px "Noto Sans Bengali", system-ui, sans-serif`; ctx.textAlign = align; ctx.fillText(s, x, y);
  }
  function arrowLine(x1, y1, x2, y2, color, label) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    for (const [ax, ay, bx] of [[x1, y1, x2], [x2, y2, x1]]) {
      const d = Math.sign(bx - ax) || 1;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + 7 * d, ay - 4); ctx.lineTo(ax + 7 * d, ay + 4); ctx.fill();
    }
    if (label) text(label, (x1 + x2) / 2, y1 - 6, color, 12, 'center');
  }

  // ---------- helpers ----------
  const sup = (s) => String(s).replace(/[-+0-9]/g, (c) => '⁻⁺⁰¹²³⁴⁵⁶⁷⁸⁹'['-+0123456789'.indexOf(c)]);
  const sci = (x, d = 2) => {
    if (!isFinite(x)) return '—';
    if (x === 0) return '০';
    let e = Math.floor(Math.log10(Math.abs(x)));
    if (e >= -2 && e <= 4) return bn(x, d);
    let m = x / 10 ** e;
    if (Math.abs(m) >= 10 - 0.5 * 10 ** -d) { m /= 10; e += 1; }
    return `${bn(m, d)} × ১০${sup(e)}`;
  };
  function axes(x0, y0, x1, y1, xl, yl) {
    ctx.strokeStyle = css('--line'); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(x0, y0); ctx.lineTo(x1, y0); ctx.stroke();
    text(xl, x1, y0 + 14, css('--muted'), 11, 'right');
    text(yl, x0 + 4, y1 + 10, css('--muted'), 11, 'left');
  }
  function arrow(x1, y1, x2, y2, color, w = 2) {
    const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1);
    if (L < 1) return;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const s = Math.min(9, L * 0.5);
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - s * Math.cos(a - 0.4), y2 - s * Math.sin(a - 0.4));
    ctx.lineTo(x2 - s * Math.cos(a + 0.4), y2 - s * Math.sin(a + 0.4)); ctx.fill();
  }
  function ring(x, y, r, color, w = 1.5, dash) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash ?? []);
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  // test tube / beaker: liquid colour, optional precipitate colour, ring colour, bubbles
  function tube(x, y, w, h, o, t) {
    const lh = h * (o.level ?? 0.62);
    ctx.save();
    rrect(x, y, w, h, [0, 0, w / 2, w / 2]); ctx.clip();
    ctx.fillStyle = o.liquid ?? 'rgba(160,190,230,.18)'; ctx.fillRect(x, y + h - lh, w, lh);
    if (o.ppt) { ctx.fillStyle = o.ppt; ctx.fillRect(x, y + h - lh * 0.32, w, lh * 0.32);
      for (let i = 0; i < 18; i++) dot(x + ((i * 37) % 97) / 97 * w, y + h - lh * (0.32 + ((i * 53) % 61) / 61 * 0.5), 1.6, o.ppt); }
    if (o.ring) { ctx.fillStyle = o.ring; ctx.fillRect(x, y + h - lh * 0.55, w, 7); }
    if (o.bubbles) for (let i = 0; i < 7; i++) { const yy = y + h - ((t * 40 + i * 23) % lh); ring(x + w * (0.25 + 0.5 * ((i * 41) % 13) / 13), yy, 2.2, css('--muted'), 1); }
    ctx.restore();
    ctx.strokeStyle = css('--muted'); ctx.lineWidth = 1.6; rrect(x, y, w, h, [0, 0, w / 2, w / 2]); ctx.stroke();
  }
  const R_J = 8.314, R_L = 0.0821;
  const ln10 = Math.LN10;
  function graph(x0, y0, x1, y1, fns, xmax, ymax, xl, yl) {
    axes(x0, y0, x1, y1, xl, yl);
    fns.forEach(([f, col, w2]) => curve((x) => y0 - Math.max(0, Math.min(1.05, f((x - x0) / (x1 - x0) * xmax) / ymax)) * (y0 - y1), x0, x1, col, w2 ?? 2.4));
  }

  // ---------- simulations ----------
  const S = [];

  S.push({
    id: 'order', tab: '১. বিক্রিয়ার ক্রম ও অর্ধায়ু',
    title: 'শূন্য, প্রথম ও দ্বিতীয় ক্রম বিক্রিয়া: ঘনমাত্রা বনাম সময়',
    sub: 'শূন্য ক্রম: x = kt, t½ = a/2k। প্রথম ক্রম: k = (1/t) ln a/(a − x), t½ = 0.693/k — প্রাথমিক ঘনমাত্রার উপর নির্ভর করে না। দ্বিতীয় ক্রম: k = (1/t)·x/a(a − x), t½ = 1/ka।',
    controls: [['a', 'প্রাথমিক ঘনমাত্রা a', 0.2, 2, 0.05, 1, 'mol/L'], ['k', 'হার ধ্রুবক k (সংখ্যাগত মান)', 0.02, 0.5, 0.01, 0.1, ''], ['t', 'সময় t', 0, 60, 0.5, 10, 's']],
    buttons: [['z', 'শূন্য ক্রম', false, false, 'ord'], ['f', 'প্রথম ক্রম', true, false, 'ord'], ['s', 'দ্বিতীয় ক্রম', false, false, 'ord']],
    legend: [['--a', '[A] বনাম t'], ['--d', 'এখনকার সময়'], ['--b', 'অর্ধায়ু t½']],
    draw(w, h, t, p, b) {
      const { a, k } = p, ord = b.ord;
      const C = (tt) => ord === 'z' ? Math.max(0, a - k * tt) : ord === 'f' ? a * Math.exp(-k * tt) : a / (1 + k * a * tt);
      const half = ord === 'z' ? a / (2 * k) : ord === 'f' ? 0.693 / k : 1 / (k * a);
      const gx0 = 40, gx1 = w - 16, gy0 = h - 24, gy1 = 16, tmax = 60;
      graph(gx0, gy0, gx1, gy1, [[C, css('--a')]], tmax, 2.05, 't →', '[A]');
      const X = (tt) => gx0 + tt / tmax * (gx1 - gx0), Y = (c) => gy0 - c / 2.05 * (gy0 - gy1);
      if (half <= tmax) { ctx.strokeStyle = css('--b'); ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(half), gy0); ctx.lineTo(X(half), Y(a / 2)); ctx.lineTo(gx0, Y(a / 2)); ctx.stroke(); ctx.setLineDash([]); text('t½', X(half), gy0 + 12, css('--b'), 11, 'center'); }
      dot(X(p.t), Y(C(p.t)), 6, css('--d'));
      const unit = ord === 'z' ? 'mol L⁻¹ s⁻¹' : ord === 'f' ? 's⁻¹' : 'L mol⁻¹ s⁻¹';
      const x = a - C(p.t);
      this.info = `<span class="big">t = ${bn(p.t, 1)} s-এ [A] = ${bn(C(p.t), 3)} mol/L (বিক্রিয়া হয়েছে x = ${bn(x, 3)}); t½ = ${bn(half, 2)} s</span><br>k-এর একক: ${unit}। ${ord === 'f' ? 'a বদলে দেখো — প্রথম ক্রমে t½ একই থাকে, এবং বিক্রিয়া কখনো পুরোপুরি শেষ হয় না।' : ord === 'z' ? 'শূন্য ক্রমে হার ঘনমাত্রার উপর নির্ভর করে না — রেখাটি সরল; t½ = a/2k।' : 'দ্বিতীয় ক্রমে a বাড়ালে t½ কমে (t½ = 1/ka)।'}`;
    },
  });

  S.push({
    id: 'arr', tab: '২. আরহেনিয়াস ও সক্রিয়ণ শক্তি',
    title: 'আরহেনিয়াস সমীকরণ: k = A·e^(−Ea/RT)',
    sub: 'Ea কম হলে k বেশি — বিক্রিয়া দ্রুত। তাপমাত্রা বাড়লে বেশি অণু সক্রিয়ণ শক্তি পায়। ln k বনাম 1/T লেখচিত্র সরলরেখা, ঢাল = −Ea/R। তাপমাত্রা গুণাঙ্ক = k(t+10)/k(t)।',
    controls: [['Ea', 'সক্রিয়ণ শক্তি Ea', 10, 150, 1, 55, 'kJ/mol'], ['T', 'তাপমাত্রা', 250, 450, 1, 300, 'K']],
    legend: [['--a', 'ln k বনাম 1/T'], ['--d', 'এখনকার তাপমাত্রা']],
    draw(w, h, t, p) {
      const Ea = p.Ea * 1000, f = (T) => Math.exp(-Ea / (R_J * T));
      const gx0 = 46, gx1 = w - 16, gy0 = h - 24, gy1 = 16;
      axes(gx0, gy0, gx1, gy1, '1/T →', 'ln k');
      const u0 = 1 / 450, u1 = 1 / 250, lk = (u) => -Ea / R_J * u;
      const ylo = lk(u1), yhi = lk(u0);
      const X = (u) => gx0 + (u - u0) / (u1 - u0) * (gx1 - gx0), Y = (v) => gy0 - (v - ylo) / (yhi - ylo + 1e-9) * (gy0 - gy1) * 0.9;
      curve((x) => Y(lk(u0 + (x - gx0) / (gx1 - gx0) * (u1 - u0))), gx0, gx1, css('--a'), 2.6);
      dot(X(1 / p.T), Y(lk(1 / p.T)), 6, css('--d'));
      const ratio = f(p.T + 10) / f(p.T);
      this.info = `<span class="big">e^(−Ea/RT) = ${sci(f(p.T), 3)} — অর্থাৎ প্রতি ${sci(1 / f(p.T), 2)}টি সংঘর্ষের ১টির যথেষ্ট শক্তি আছে</span><br>${bn(p.T, 0)} K থেকে ${bn(p.T + 10, 0)} K করলে k বাড়ে ${bn(ratio, 2)} গুণ (তাপমাত্রা গুণাঙ্ক)। ঢাল = −Ea/R = ${sci(-Ea / R_J, 3)} K; log k-এর জন্য ঢাল = −Ea/2.303R। নোটে: বেশিরভাগ বিক্রিয়ায় 27°C-এ Ea প্রায় 55 kJ/mol।`;
    },
  });

  S.push({
    id: 'profile', tab: '৩. শক্তি চিত্র ও প্রভাবক',
    title: 'বিক্রিয়ার শক্তি চিত্র: Ea = Ex − EA, ΔH = EB − EA',
    sub: 'EA = বিক্রিয়কের, EB = উৎপাদের, Ex = সক্রিয় জটিল যৌগের স্থিতিশক্তি। তাপোৎপাদীতে EB < EA (ΔH ঋণাত্মক), তাপহারীতে EB > EA। প্রভাবক কম শক্তির বিকল্প পথ তৈরি করে (Ea′ < Ea), কিন্তু ΔH ও সাম্যাবস্থা বদলায় না।',
    controls: [['EA', 'বিক্রিয়কের শক্তি EA', 0, 200, 1, 100, 'kJ'], ['EB', 'উৎপাদের শক্তি EB', 0, 200, 1, 40, 'kJ'], ['Ex', 'শীর্ষবিন্দুর শক্তি Ex', 50, 300, 1, 220, 'kJ'], ['cat', 'প্রভাবক Ea কতটা কমায়', 0, 100, 1, 50, 'kJ']],
    buttons: [['catOn', 'প্রভাবক যোগ', true, false]],
    legend: [['--a', 'প্রভাবক ছাড়া'], ['--e', 'প্রভাবকসহ'], ['--d', 'বিক্রিয়া কণা']],
    draw(w, h, t, p, b) {
      const EA = p.EA, EB = p.EB, Ex = Math.max(p.Ex, EA + 1, EB + 1), Exc = Math.max(EA, EB, Ex - p.cat) + 0.5;
      const x0 = 40, x1 = w - 20, y0 = h - 20, y1 = 18, Y = (e) => y0 - e / 300 * (y0 - y1);
      const path = (peak) => (x) => { const u = (x - x0) / (x1 - x0); if (u < 0.25) return Y(EA); if (u > 0.75) return Y(EB); const v = (u - 0.25) / 0.5; const base = EA + (EB - EA) * v; return Y(base + (peak - base) * Math.sin(Math.PI * v) ** 2 * 1); };
      axes(x0, y0, x1, y1, 'বিক্রিয়ার অগ্রগতি →', 'E');
      curve(path(Ex), x0, x1, css('--a'), 2.6);
      if (b.catOn) curve(path(Exc), x0, x1, css('--e'), 2.2);
      const u = ((t * 0.15) % 1), xx = x0 + u * (x1 - x0);
      dot(xx, path(b.catOn ? Exc : Ex)(xx) - 6, 5, css('--d'));
      [['EA', EA], ['EB', EB], ['Ex', Ex]].forEach(([l, e]) => text(l, x1 + 2, Y(e) + 4, css('--muted'), 10, 'right'));
      const dH = EB - EA, Ea = Ex - EA, Eac = Exc - EA;
      this.info = `<span class="big">Ea = Ex − EA = ${bn(Ea, 0)} kJ${b.catOn ? `; প্রভাবকসহ Ea′ = ${bn(Eac, 0)} kJ` : ''} · ΔH = EB − EA = ${bn(dH, 0)} kJ → ${dH < 0 ? 'তাপোৎপাদী' : dH > 0 ? 'তাপহারী' : 'ΔH শূন্য'}</span><br>পশ্চাৎ বিক্রিয়ার Ea = Ex − EB = ${bn(Ex - EB, 0)} kJ। প্রভাবক দুই দিকের Ea সমান পরিমাণে কমায়, তাই সাম্যাবস্থা বদলায় না — শুধু দ্রুত পৌঁছায়।`;
    },
  });

  const RXN = {
    nh3: { eq: 'N₂ + 3H₂ ⇌ 2NH₃', dn: -2, dH: -92.2, r: [['N₂', 1], ['H₂', 3]], pr: [['NH₃', 2]] },
    no2: { eq: 'N₂O₄ ⇌ 2NO₂', dn: 1, dH: 58.6, r: [['N₂O₄', 1]], pr: [['NO₂', 2]] },

    draw(w, h, t, p) {
      const v = p.num + 90, s = String(v).padStart(3, '0');
      const C = +s[0], H = +s[1], F = +s[2];
      const valence = 2 * C + 2, Cl = valence - H - F;
      const ok = C >= 1 && Cl >= 0;
      const sub = (n) => n > 1 ? String(n).replace(/\d/g, (d) => '₀₁₂₃₄₅₆₇₈₉'[d]) : '';
      const formula = ok ? `C${sub(C)}${H ? 'H' + sub(H) : ''}${Cl ? 'Cl' + sub(Cl) : ''}${F ? 'F' + sub(F) : ''}` : '—';
      const items = [['C', C, '--a'], ['H', H, '--c'], ['F', F, '--e'], ['Cl', Math.max(0, Cl), '--b']];
      const bw = (w - 60) / 4;
      items.forEach(([n, c, col], i) => { for (let k = 0; k < c; k++) dot(40 + i * bw + bw / 2 + ((k % 3) - 1) * 18, h - 50 - Math.floor(k / 3) * 22, 9, css(col)); text(`${n}: ${bn(c, 0)}`, 40 + i * bw + bw / 2, h - 18, css('--text'), 12, 'center'); });
      text(`${bn(p.num, 0)} + ৯০ = ${bn(v, 0)}`, w / 2, 34, css('--muted'), 14, 'center');
      text(formula, w / 2, 70, css('--text'), 22, 'center');
      this.info = ok
        ? `<span class="big">${H > 0 ? 'HCFC' : 'CFC'}-${bn(p.num, 0)} → C = ${bn(C, 0)}, H = ${bn(H, 0)}, F = ${bn(F, 0)}, Cl = ${bn(Cl, 0)} → ${formula}</span><br>উল্টো নিয়ম: CFC-abc-এ a = C − 1, b = H + 1, c = F। ${H > 0 ? 'H থাকলে HCFC — ওজোন স্তরের কম ক্ষতি করে, জীবনকাল 2–10 বছর।' : 'H নেই — পূর্ণ CFC, জীবনকাল প্রায় 100 বছর।'}`
        : `<span class="big">এই নম্বরে বৈধ সংকেত হয় না (H + F কার্বনের যোজনীর চেয়ে বেশি)</span>`;
    },
  });

  // ---------- runner ----------
  let cur = null, params = {}, btn = {}, t0 = performance.now(), paused = false;
  const $ = (id) => document.getElementById(id);
  $('tabs').innerHTML = S.map((s, i) => `<button data-i="${i}">${s.tab}</button>`).join('');
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) select(Number(b.dataset.i)); });

  function select(i) {
    cur = S[i];
    document.querySelectorAll('#tabs button').forEach((b, j) => b.classList.toggle('on', j === i));
    $('title').textContent = cur.title;
    $('sub').textContent = cur.sub;
    params = {}; btn = {};
    $('ctl').innerHTML = cur.controls.map(([k, label, min, max, step, val, unit]) => {
      params[k] = val;
      return `<label>${label}<b id="v_${k}">${bn(val, step < 0.01 ? 3 : step < 1 ? 2 : 0)} ${unit}</b><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-k="${k}" data-u="${unit}" data-s="${step}"></label>`;
    }).join('');
    $('buttons').innerHTML = `<button data-b="pause">${paused ? '▶ চালাও' : '⏸ থামাও'}</button>` + (cur.buttons ?? []).map(([k, label, on, isAction, group]) => {
      if (group) { if (on) btn[group] = k; } else if (!isAction) btn[k] = on;
      return `<button data-b="${k}" ${group ? `data-g="${group}"` : ''} ${isAction ? 'data-a="1"' : ''} class="${on ? 'on' : ''}">${label}</button>`;
    }).join('');
    $('legend').innerHTML = (cur.legend ?? []).map(([c, l]) => `<span><i style="background:var(${c})"></i>${l}</span>`).join('');
    $('note').textContent = cur.note ?? 'নোট: হিসাবগুলো নোটের সূত্র অনুযায়ী; ছবি ও রং বোঝানোর জন্য আনুমানিক।';
    cv.style.height = (cur.height ?? 260) + 'px';
    resize();
  }

  $('ctl').addEventListener('input', (e) => {
    const r = e.target; if (!r.dataset.k) return;
    params[r.dataset.k] = Number(r.value);
    const s = Number(r.dataset.s);
    $(`v_${r.dataset.k}`).textContent = `${bn(Number(r.value), s < 0.01 ? 3 : s < 1 ? 2 : 0)} ${r.dataset.u}`;
  });
  $('buttons').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.b;
    if (k === 'pause') { paused = !paused; b.textContent = paused ? '▶ চালাও' : '⏸ থামাও'; return; }
    if (b.dataset.a) { cur.action?.call(cur, k, params); return; }
    if (b.dataset.g) { btn[b.dataset.g] = k; document.querySelectorAll(`[data-g="${b.dataset.g}"]`).forEach((x) => x.classList.toggle('on', x === b)); return; }
    btn[k] = !btn[k]; b.classList.toggle('on', btn[k]);
  });

  let W = 0, H = 0, simT = 0, last = performance.now();
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!paused) simT += dt;
    if (cur) {
      ctx.clearRect(0, 0, W, H);
      cur.draw(W, H, simT, params, btn);
      $('info').innerHTML = cur.info ?? '';
    }
    requestAnimationFrame(frame);
  }
  select(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

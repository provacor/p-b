<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>গুণগত রসায়ন ল্যাব — ২য় অধ্যায়ের সিমুলেশন</title>
<style>
  :root {
    --bg: #0d1017; --panel: #151a24; --panel2: #1c2230; --line: #2a3242; --text: #e9edf4; --muted: #8e98ab;
    --a: #7ea6ff; --b: #f7c35c; --c: #4fd8c4; --d: #fb8fb0; --e: #6ee7a0; --grid: rgba(255,255,255,.06);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6fa; --panel: #fff; --panel2: #f1f4f9; --line: #dde3ec; --text: #0f172a; --muted: #5b6577;
      --a: #3b6cf6; --b: #c58a06; --c: #0f9f8e; --d: #e2457a; --e: #16a34a; --grid: rgba(15,23,42,.07); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Noto Sans Bengali", "Inter", system-ui, sans-serif; }
  header { padding: 14px 14px 6px; }
  h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .82rem; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px; scrollbar-width: none; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 99px; padding: 7px 12px; font: inherit; font-size: .82rem; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--a); border-color: transparent; color: #fff; }
  main { padding: 6px 14px 24px; max-width: 900px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  h2 { margin: 2px 0 2px; font-size: 1.05rem; }
  .sub { color: var(--muted); font-size: .82rem; margin: 0 0 10px; }
  canvas { width: 100%; height: 260px; display: block; background: var(--panel2); border-radius: 12px; touch-action: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .row button { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 10px; padding: 7px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
  .row button.on { border-color: var(--a); color: var(--a); }
  .ctl { display: grid; gap: 8px; margin-top: 10px; }
  .ctl label { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .84rem; }
  .ctl label b { color: var(--a); font-variant-numeric: tabular-nums; }
  .ctl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--a); }
  .info { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel2); font-size: .86rem; }
  .info code { font-family: ui-monospace, monospace; color: var(--c); }
  .info .big { font-size: 1.05rem; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .78rem; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .note { font-size: .78rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>গুণগত রসায়ন ল্যাব</h1>
  <p>রসায়ন ১ম পত্র · ২য় অধ্যায় (গুণগত রসায়ন) — নোটের সূত্র ও পরীক্ষাগুলোর হাতে-কলমে সিমুলেশন। স্লাইডার আর বোতাম বদলে দেখো কী হয়।</p>
</header>
<nav class="tabs" id="tabs"></nav>
<main><section class="card">
  <h2 id="title"></h2>
  <p class="sub" id="sub"></p>
  <canvas id="cv"></canvas>
  <div class="legend" id="legend"></div>
  <div class="row" id="buttons"></div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
  <p class="note" id="note"></p>
</section></main>

<script>
(() => {
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const bn = (x, d = 2) => {
    const s = typeof x === 'number' ? (Number.isInteger(x) ? String(x) : x.toFixed(d)) : String(x);
    return s.replace(/\d/g, (c) => '০১২৩৪৫৬৭৮৯'[c]);
  };
  const TAU = Math.PI * 2;

  // ---------- drawing helpers ----------
  function grid(w, h, midY = h / 2) {
    ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = midY % 40; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    ctx.strokeStyle = css('--line'); ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(w, midY); ctx.stroke();
  }
  function curve(fn, x0, x1, color, width = 2.4, step = 2) {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
    for (let x = x0; x <= x1; x += step) { const y = fn(x); x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
  function dot(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function text(s, x, y, color = css('--muted'), size = 12, align = 'left') {
    ctx.fillStyle = color; ctx.font = `${size}px "Noto Sans Bengali", system-ui, sans-serif`; ctx.textAlign = align; ctx.fillText(s, x, y);
  }
  function arrowLine(x1, y1, x2, y2, color, label) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    for (const [ax, ay, bx] of [[x1, y1, x2], [x2, y2, x1]]) {
      const d = Math.sign(bx - ax) || 1;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + 7 * d, ay - 4); ctx.lineTo(ax + 7 * d, ay + 4); ctx.fill();
    }
    if (label) text(label, (x1 + x2) / 2, y1 - 6, color, 12, 'center');
  }

  // ---------- helpers ----------
  const sup = (s) => String(s).replace(/[-+0-9]/g, (c) => '⁻⁺⁰¹²³⁴⁵⁶⁷⁸⁹'['-+0123456789'.indexOf(c)]);
  const sci = (x, d = 2) => {
    if (!isFinite(x)) return '—';
    if (x === 0) return '০';
    let e = Math.floor(Math.log10(Math.abs(x)));
    if (e >= -2 && e <= 4) return bn(x, d);
    let m = x / 10 ** e;
    if (Math.abs(m) >= 10 - 0.5 * 10 ** -d) { m /= 10; e += 1; }
    return `${bn(m, d)} × ১০${sup(e)}`;
  };
  function axes(x0, y0, x1, y1, xl, yl) {
    ctx.strokeStyle = css('--line'); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(x0, y0); ctx.lineTo(x1, y0); ctx.stroke();
    text(xl, x1, y0 + 14, css('--muted'), 11, 'right');
    text(yl, x0 + 4, y1 + 10, css('--muted'), 11, 'left');
  }
  function arrow(x1, y1, x2, y2, color, w = 2) {
    const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1);
    if (L < 1) return;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const s = Math.min(9, L * 0.5);
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - s * Math.cos(a - 0.4), y2 - s * Math.sin(a - 0.4));
    ctx.lineTo(x2 - s * Math.cos(a + 0.4), y2 - s * Math.sin(a + 0.4)); ctx.fill();
  }
  function ring(x, y, r, color, w = 1.5, dash) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash ?? []);
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  // test tube / beaker: liquid colour, optional precipitate colour, ring colour, bubbles
  function tube(x, y, w, h, o, t) {
    const lh = h * (o.level ?? 0.62);
    ctx.save();
    rrect(x, y, w, h, [0, 0, w / 2, w / 2]); ctx.clip();
    ctx.fillStyle = o.liquid ?? 'rgba(160,190,230,.18)'; ctx.fillRect(x, y + h - lh, w, lh);
    if (o.ppt) { ctx.fillStyle = o.ppt; ctx.fillRect(x, y + h - lh * 0.32, w, lh * 0.32);
      for (let i = 0; i < 18; i++) dot(x + ((i * 37) % 97) / 97 * w, y + h - lh * (0.32 + ((i * 53) % 61) / 61 * 0.5), 1.6, o.ppt); }
    if (o.ring) { ctx.fillStyle = o.ring; ctx.fillRect(x, y + h - lh * 0.55, w, 7); }
    if (o.bubbles) for (let i = 0; i < 7; i++) { const yy = y + h - ((t * 40 + i * 23) % lh); ring(x + w * (0.25 + 0.5 * ((i * 41) % 13) / 13), yy, 2.2, css('--muted'), 1); }
    ctx.restore();
    ctx.strokeStyle = css('--muted'); ctx.lineWidth = 1.6; rrect(x, y, w, h, [0, 0, w / 2, w / 2]); ctx.stroke();
  }
  const SYM = 'H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ');
  const LET = 'spdf';

  // ---------- simulations ----------
  const S = [];

  S.push({
    id: 'temp', tab: '১. দ্রাব্যতা ও তাপমাত্রা',
    title: 'তাপমাত্রায় দ্রাব্যতা ও শীতল করলে অধঃক্ষেপ',
    sub: 'তাপহারী (ΔH +ve) লবণে তাপ বাড়লে দ্রাব্যতা বাড়ে (KNO₃, NaNO₃, AgNO₃…); তাপোৎপাদী লবণে কমে (Li₂SO₄, Ca(OH)₂…); গ্লোবার লবণে 32.4°C পর্যন্ত বাড়ে, পরে কমে। গরম সম্পৃক্ত দ্রবণ ঠান্ডা করলে বাড়তি দ্রব অধঃক্ষিপ্ত হয়।',
    controls: [['S1', '60°C তাপমাত্রায় দ্রাব্যতা', 20, 200, 1, 120, 'g/100 g'], ['S2', '40°C তাপমাত্রায় দ্রাব্যতা', 5, 200, 1, 80, 'g/100 g'], ['m', 'সম্পৃক্ত দ্রবণের ভর', 50, 1000, 10, 500, 'g']],
    buttons: [['endo', 'তাপহারী', true, false, 'kind'], ['exo', 'তাপোৎপাদী', false, false, 'kind'], ['glauber', 'গ্লোবার লবণ', false, false, 'kind']],
    legend: [['--a', 'দ্রাব্যতা বক্ররেখা'], ['--d', 'অধঃক্ষিপ্ত কেলাস']],
    draw(w, h, t, p, b) {
      const gx0 = 34, gx1 = w * 0.55, gy0 = h - 22, gy1 = 16;
      axes(gx0, gy0, gx1, gy1, 'T →', 'S');
      const kind = b.kind;
      const f = (u) => kind === 'endo' ? 0.15 + 0.75 * u * u : kind === 'exo' ? 0.85 - 0.6 * u : (u < 0.45 ? 0.2 + 1.5 * u : 0.875 - 0.5 * (u - 0.45));
      curve((x) => gy0 - f((x - gx0) / (gx1 - gx0)) * (gy0 - gy1), gx0, gx1, css('--a'), 2.6);
      if (kind === 'glauber') text('32.4°C', gx0 + 0.45 * (gx1 - gx0), gy1 + 8, css('--muted'), 11, 'center');
      // beaker with crystals
      const hot = Math.max(p.S1, p.S2), cold = Math.min(p.S1, p.S2);
      const cooling = p.S1 >= p.S2;
      const ppt = (hot - cold) / (100 + hot) * p.m;
      const bx = w * 0.64, bw = w * 0.3, by = 30, bh = h - 60;
      const phase = (t % 6) / 6;
      tube(bx, by, bw, bh, { liquid: 'rgba(126,166,255,.22)', level: 0.75 }, t);
      const nCr = Math.min(40, Math.round(ppt / 4) * Math.min(1, phase * 2));
      for (let i = 0; i < nCr; i++) { const cx = bx + 8 + ((i * 29) % 100) / 100 * (bw - 16), cy = by + bh - 8 - ((i * 17) % 30) / 30 * 26;
        ctx.fillStyle = css('--d'); ctx.save(); ctx.translate(cx, cy); ctx.rotate(0.785); ctx.fillRect(-3, -3, 6, 6); ctx.restore(); }
      text(cooling ? `60°C → 40°C` : `40°C → 60°C`, bx + bw / 2, by - 8, css('--muted'), 12, 'center');
      this.info = `<span class="big">অধঃক্ষেপ = (${bn(hot, 0)} − ${bn(cold, 0)}) ÷ (১০০ + ${bn(hot, 0)}) × ${bn(p.m, 0)} = ${bn(ppt, 2)} g</span><br>${bn(100 + hot, 0)} g দ্রবণে ${bn(hot - cold, 0)} g দ্রব বাড়তি থাকে — তাই ${bn(p.m, 0)} g দ্রবণে আনুপাতিক হিসাব। ${cooling ? '' : '(উল্টো দিকে গরম করলে অধঃক্ষেপ পড়ে না, বরং আরও দ্রব যোগ করতে হয়: ' + bn((hot - cold) / (100 + cold) * p.m, 2) + ' g।) '}<br>ভুল কোরো না: ‘100 g দ্রাবক’ ও ‘100 g দ্রবণ’ এক নয় — সম্পৃক্ত দ্রবণের ভর = 100 + S।`;
    },
  });

  S.push({
    id: 'ksp', tab: '২. Ksp ও দ্রাব্যতা',
    title: 'দ্রাব্যতা গুণফল: AxBy হলে Ksp = xˣ·yʸ·S^(x+y)',
    sub: 'AB → S², AB₂/A₂B → 4S³, AB₃ → 27S⁴, A₂B₃/A₃B₂ → 108S⁵। উল্টো দিক: S = (Ksp/xˣyʸ)^(1/(x+y))। Ksp-এর একক mol^(x+y) L^−(x+y)।',
    controls: [['lk', 'log₁₀ Ksp', -20, -2, 0.1, -10, '']],
    buttons: [['AB', 'AB (AgCl)', true, false, 'type'], ['AB2', 'AB₂ (CaF₂, PbI₂)', false, false, 'type'], ['AB3', 'AB₃ (Fe(OH)₃)', false, false, 'type'], ['A2B3', 'A₂B₃ (Bi₂S₃)', false, false, 'type']],
    legend: [['--a', 'ক্যাটায়নের ঘনমাত্রা'], ['--b', 'অ্যানায়নের ঘনমাত্রা']],
    draw(w, h, t, p, b) {
      const [x, y] = { AB: [1, 1], AB2: [1, 2], AB3: [1, 3], A2B3: [2, 3] }[b.type];
      const Ksp = 10 ** p.lk, coef = x ** x * y ** y, S = (Ksp / coef) ** (1 / (x + y));
      const ca = x * S, cb = y * S;
      const lo = -12, X = (v) => 40 + ((Math.log10(v) - lo) / (0 - lo)) * (w - 60);
      text('লগ স্কেলে ঘনমাত্রা (mol/L)', 40, 20, css('--muted'), 11);
      for (let e = lo; e <= 0; e += 2) { const xx = X(10 ** e); ctx.strokeStyle = css('--grid'); ctx.beginPath(); ctx.moveTo(xx, 28); ctx.lineTo(xx, h - 20); ctx.stroke(); text(`১০${sup(e)}`, xx, h - 6, css('--muted'), 10, 'center'); }
      [['S', S, '--c'], [`ক্যাটায়ন = ${x === 1 ? '' : x}S`, ca, '--a'], [`অ্যানায়ন = ${y === 1 ? '' : y}S`, cb, '--b']].forEach(([l, v, c], i) => {
        const yy = 44 + i * 52;
        ctx.fillStyle = css(c); ctx.fillRect(40, yy, Math.max(2, X(v) - 40), 22);
        text(`${l} = ${sci(v, 3)} mol/L`, 44, yy - 5, css('--muted'), 12);
      });
      const u = x + y;
      this.info = `<span class="big">Ksp = ${sci(Ksp, 2)} mol${sup(u)} L${sup(-u)} → S = (Ksp/${bn(coef, 0)})^(১/${bn(u, 0)}) = ${sci(S, 3)} mol/L</span><br>যাচাই: ${x === 1 ? '' : `(${x}S)${sup(x)} × `}${x === 1 ? 'S' : ''}${y === 1 ? ' × S' : ` × (${y}S)${sup(y)}`} = ${bn(coef, 0)}S${sup(u)}। একই Ksp-তে সংকেত বদলালে দ্রাব্যতা বদলায় — তাই ভিন্ন ধরনের লবণের দ্রাব্যতা শুধু Ksp দেখে তুলনা করা যায় না।`;
    },
  });

  S.push({
    id: 'ppt', tab: '৩. অধঃক্ষেপ পড়বে কি?',
    title: 'দুটি দ্রবণ মেশালে অধঃক্ষেপ: Kip বনাম Ksp',
    sub: '① মেশানোর পর নতুন আয়তনে প্রতিটি আয়নের ঘনমাত্রা (M₁V₁ = M₂V₂) ② Kip হিসাব ③ Kip > Ksp হলে অধঃক্ষেপ পড়বে, Kip ≤ Ksp হলে পড়বে না। উদাহরণ: Ba(NO₃)₂ + Na₂SO₄ → BaSO₄ (Ksp = 1.1 × 10⁻¹⁰)।',
    controls: [['l1', 'Ba(NO₃)₂ এর ঘনমাত্রা (log₁₀ M)', -7, -1, 0.1, -4, ''], ['V1', 'Ba(NO₃)₂ এর আয়তন', 10, 500, 10, 100, 'mL'], ['l2', 'Na₂SO₄ এর ঘনমাত্রা (log₁₀ M)', -7, -1, 0.1, -5, ''], ['V2', 'Na₂SO₄ এর আয়তন', 10, 500, 10, 100, 'mL']],
    legend: [['--a', 'Ba²⁺ দ্রবণ'], ['--b', 'SO₄²⁻ দ্রবণ'], ['--d', 'BaSO₄ অধঃক্ষেপ']],
    draw(w, h, t, p) {
      const Ksp = 1.1e-10, c1 = 10 ** p.l1, c2 = 10 ** p.l2, V = p.V1 + p.V2;
      const ba = c1 * p.V1 / V, so = c2 * p.V2 / V, Kip = ba * so, wrong = c1 * c2;
      const yes = Kip > Ksp;
      const tw = Math.min(70, w * 0.16), th = h - 70;
      tube(w * 0.08, 30, tw, th, { liquid: 'rgba(126,166,255,.28)', level: p.V1 / 500 * 0.85 + 0.05 }, t);
      tube(w * 0.30, 30, tw, th, { liquid: 'rgba(247,195,92,.25)', level: p.V2 / 500 * 0.85 + 0.05 }, t);
      arrow(w * 0.47, h / 2, w * 0.58, h / 2, css('--muted'), 2);
      tube(w * 0.64, 30, tw * 1.6, th, { liquid: 'rgba(160,190,230,.22)', level: V / 1000 * 0.85 + 0.05, ppt: yes ? '#f4f4f4' : null }, t);
      text('Ba(NO₃)₂', w * 0.08 + tw / 2, 22, css('--a'), 11, 'center');
      text('Na₂SO₄', w * 0.30 + tw / 2, 22, css('--b'), 11, 'center');
      text(yes ? 'সাদা BaSO₄ অধঃক্ষেপ' : 'স্বচ্ছ — অধঃক্ষেপ নেই', w * 0.64 + tw * 0.8, 22, yes ? css('--d') : css('--e'), 11, 'center');

    },
  });

  const FLAME = { 'Li⁺': ['ক্রিমসন রেড (লাল)', '#dc143c', 'বর্ণহীন', null], 'Na⁺': ['সোনালী হলুদ', '#ffc300', 'বর্ণহীন', null], 'K⁺': ['হালকা বেগুনি', '#b388ff', 'গোলাপী লাল', '#ff5c8a'], 'Rb⁺': ['লালচে বেগুনী', '#c2185b', '—', null], 'Cs⁺': ['নীল', '#3d7bff', '—', null], 'Ca²⁺': ['ইটের মতো লাল', '#e2552f', 'হালকা সবুজ', '#9be59b'], 'Sr²⁺': ['ক্রিমসন লাল', '#e0115f', 'লালচে বেগুনি', '#b0306f'], 'Ba²⁺': ['হলুদাভ (কাঁচা আপেলের মতো) সবুজ', '#b5e61d', 'নীলাভ সবুজ', '#2bb5a0'], 'Cu²⁺': ['নীলাভ সবুজ', '#1fc7a8', 'বর্ণহীন', null], 'Pb²⁺': ['সাদাটে নীল', '#a9c7ff', '—', null], 'As³⁺': ['নীল', '#4466ff', 'বেগুনি', '#8f5cff'], 'Mg²⁺': ['বর্ণহীন', null, 'বর্ণহীন', null] };
  S.push({
    id: 'flame', tab: '১৩. শিখা পরীক্ষা',
    title: 'শিখা পরীক্ষা: প্লাটিনাম তার, গাঢ় HCl, অনুজ্জ্বল শিখা',
    sub: 'লবণ লাগানো প্লাটিনাম তার বুনসেন বার্নারের অনুজ্জ্বল শিখায় ধরলে উত্তেজিত ইলেকট্রন নিচে নামার সময় নির্দিষ্ট রঙের আলো দেয়। কোবাল্ট নীল কাচ Na-এর হলুদ আলো শোষণ করে। Be ও Mg শিখায় রং দেয় না।',
    controls: [],
    buttons: [...Object.keys(FLAME).map((k, i) => [k, k, i === 1, false, 'ion']), ['cobalt', 'কোবাল্ট নীল কাচ', false, false]],
    legend: [],
    draw(w, h, t, p, b) {
      const [eye, ec, cob, cc] = FLAME[b.ion];
      const col = b.cobalt ? cc : ec;
      const cx = w * 0.3, base = h - 30;
      ctx.fillStyle = css('--muted'); ctx.fillRect(cx - 14, base, 28, 26);
      for (let i = 0; i < 3; i++) {
        const fl = 1 + 0.08 * Math.sin(t * 9 + i);
        ctx.fillStyle = i === 0 ? 'rgba(80,120,255,.35)' : (col ?? 'rgba(130,160,255,.25)');
        ctx.globalAlpha = i === 0 ? 1 : 0.55;
        ctx.beginPath(); ctx.ellipse(cx, base - (h * 0.32) * fl * (1 - i * 0.2) / 2 - 2, 20 - i * 4, (h * 0.32) * fl * (1 - i * 0.2) / 2 + 2, 0, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(w * 0.62, h * 0.25); ctx.lineTo(cx + 4, h * 0.5); ctx.stroke(); dot(cx + 4, h * 0.5, 3, '#eee');
      if (b.cobalt) { ctx.fillStyle = 'rgba(40,70,220,.25)'; ctx.fillRect(cx - 60, 10, 120, h - 20); ctx.strokeStyle = 'rgba(40,70,220,.6)'; ctx.strokeRect(cx - 60, 10, 120, h - 20); }
      text(b.ion, w * 0.72, h * 0.45, css('--text'), 22, 'center');
      this.info = `<span class="big">${b.ion}: খালি চোখে ${eye}; কোবাল্ট নীল কাচে ${cob}</span><br>ছন্দ: “সানি আর সুনীল বলল কালকে তাস পেটাবে” — Na সোনালী, Pb নীল, Ba হলুদাভ সবুজ, Ca ইটের লাল, Cu সবুজ, K বেগুনি। Na শিখা 590 nm।`;
    },
  });

  const WET = {
    'Cu²⁺': [['NH₄OH (অল্প → বেশি)', { ppt: '#9ecbff' }, { liquid: 'rgba(30,80,255,.7)' }, 'প্রথমে হালকা নীল অধঃক্ষেপ, পরে গাঢ় নীল দ্রবণ [Cu(NH₃)₄]²⁺'], ['K₄[Fe(CN)₆]', { ppt: '#8b3a1a' }, null, 'লালচে বাদামী অধঃক্ষেপ Cu₂[Fe(CN)₆]'], ['KI', { ppt: '#f2f2f2', liquid: 'rgba(120,60,20,.6)' }, null, 'সাদা CuI অধঃক্ষেপ, দ্রবণ গাঢ় বাদামি']],
    'Fe²⁺': [['NH₄OH', { ppt: '#3f8f3f' }, null, 'সবুজ Fe(OH)₂ অধঃক্ষেপ'], ['K₃[Fe(CN)₆]', { ppt: '#1a2a9a' }, null, 'গাঢ় নীল অধঃক্ষেপ (টার্নবুলস ব্লু)'], ['K₄[Fe(CN)₆]', { ppt: '#9ec3ff' }, null, 'হালকা নীল অধঃক্ষেপ'], ['NH₄CNS', {}, null, 'বর্ণহীন']],
    'Fe³⁺': [['NH₄OH', { ppt: '#8b4513' }, null, 'বাদামী Fe(OH)₃ অধঃক্ষেপ'], ['K₃[Fe(CN)₆]', { liquid: 'rgba(140,80,30,.55)' }, null, 'বাদামী দ্রবণ'], ['K₄[Fe(CN)₆]', { ppt: '#1a2a9a' }, null, 'গাঢ় নীল অধঃক্ষেপ (প্রুসিয়ান ব্লু)'], ['NH₄CNS', { liquid: 'rgba(170,0,20,.8)' }, null, 'রক্ত লাল দ্রবণ Fe(CNS)₃']],
    'Zn²⁺': [['NH₄OH', { ppt: '#f2f2f2' }, {}, 'সাদা Zn(OH)₂, অতিরিক্ত NH₄OH-এ [Zn(NH₃)₄]²⁺ হয়ে দ্রবীভূত'], ['K₄[Fe(CN)₆]', { ppt: '#f2f2f2' }, null, 'সাদা Zn₂[Fe(CN)₆] অধঃক্ষেপ']],
    'Al³⁺': [['NH₄OH', { ppt: 'rgba(240,240,240,.75)' }, null, 'সাদা জেলীর ন্যায় Al(OH)₃ অধঃক্ষেপ']],
    'Ca²⁺': [['NH₄OH', {}, null, 'কোনো বিক্রিয়া ঘটে না'], ['(NH₄)₂C₂O₄', { ppt: '#f7f7f7' }, null, 'সাদা সূক্ষ্ম গুঁড়ার CaC₂O₄ অধঃক্ষেপ']],
    'Na⁺': [['K₂H₂Sb₂O₇', { ppt: '#f2f2f2' }, null, 'সাদা Na₂H₂Sb₂O₇ অধঃক্ষেপ']],
    'NH₄⁺': [['নেসলার (K₂[HgI₄] + KOH)', { ppt: '#8b4a16' }, null, 'বাদামি অধঃক্ষেপ']],
    'Ba²⁺': [['K₂CrO₄', { ppt: '#f5d000' }, null, 'হলুদ BaCrO₄ অধঃক্ষেপ']],
    'Cl⁻': [['AgNO₃', { ppt: '#f5f5f5' }, {}, 'সাদা AgCl — NH₄OH-এ দ্রবণীয়']],
    'Br⁻': [['AgNO₃', { ppt: '#f3eaa0' }, null, 'হালকা হলুদ AgBr — NH₄OH-এ আংশিক দ্রবণীয়']],
    'I⁻': [['AgNO₃', { ppt: '#f2d000' }, null, 'গাঢ় হলুদ AgI — NH₄OH-এ অদ্রবণীয়']],
    'SO₄²⁻': [['Ba(NO₃)₂ → লঘু HCl', { ppt: '#f5f5f5' }, null, 'সাদা BaSO₄, HCl-এ দ্রবীভূত হয় না'], ['লেড অ্যাসিটেট', { ppt: '#f5f5f5' }, null, 'সাদা PbSO₄']],
    'CO₃²⁻': [['Ba(NO₃)₂ → লঘু HCl', { ppt: '#f5f5f5' }, { bubbles: true }, 'সাদা BaCO₃, HCl-এ CO₂ বুদবুদসহ দ্রবীভূত'], ['লেড অ্যাসিটেট', { ppt: '#f5f5f5' }, null, 'সাদা PbCO₃']],
    'NO₃⁻': [['FeSO₄ + গাঢ় H₂SO₄', { ring: '#7a3b12' }, null, 'বাদামী বলয় [Fe(H₂O)₅NO]SO₄']],
    'S²⁻': [['লেড অ্যাসিটেট', { ppt: '#111' }, null, 'কালো PbS অধঃক্ষেপ'], ['সোডিয়াম নাইট্রোপ্রুসাইড', { liquid: 'rgba(170,40,170,.7)' }, null, 'গোলাপি/বেগুনি বর্ণ']],
  };
  S.push({
    id: 'wet', tab: '১৪. সিক্ত পরীক্ষা',
    title: 'দ্রবণে আয়ন শনাক্তকরণ — সিক্ত পরীক্ষা',
    sub: 'আয়ন বেছে নাও — প্রতিটি বিকারকের টেস্টটিউবে কী দেখা যায়। ফেরো-ফেরি ক্রস নিয়ম: Fe²⁺ + ফেরিসায়ানাইড (K₃) এবং Fe³⁺ + ফেরোসায়ানাইড (K₄) → গাঢ় নীল।',
    controls: [],
    buttons: Object.keys(WET).map((k, i) => [k, k, i === 0, false, 'ion']),
    legend: [],
    height: 280,
    draw(w, h, t, p, b) {
      const tests = WET[b.ion], n = tests.length, phase = Math.min(1, (t % 7) / 3);
      const tw = Math.min(56, w / (n * 2.2)), gap = (w - n * tw) / (n + 1);
      const lines = [];
      tests.forEach(([reagent, o1, o2, obs], i) => {
        const x = gap + i * (tw + gap), o = phase < 0.5 || !o2 ? o1 : { ...o1, ...o2 };
        const view = phase < 0.15 ? {} : o;
        tube(x, 40, tw, h - 110, { liquid: 'rgba(160,190,230,.2)', ...view, level: 0.6 }, t);
        text(reagent.length > 14 ? reagent.slice(0, 14) + '…' : reagent, x + tw / 2, 28, css('--muted'), 10, 'center');
        text(`${bn(i + 1, 0)}`, x + tw / 2, h - 56, css('--text'), 13, 'center');
        lines.push(`${bn(i + 1, 0)}. ${reagent} → ${obs}`);
      });
      this.info = `<span class="big">${b.ion}</span><br>${lines.join('<br>')}`;
    },
  });

  S.push({
    id: 'decay', tab: '১৫. তেজস্ক্রিয় ক্ষয়',
    title: 'α ও β ক্ষয়: (Z, A) কীভাবে বদলায়',
    sub: 'α বের হলে Z − 2, A − 4; β বের হলে Z + 1, A একই; γ-তে কিছু বদলায় না। α সংখ্যা = ΔA/4, β সংখ্যা = Zনতুন + 2α − Zআগের। উদাহরণ: ²²⁸₉₀Th → ²¹²₈₃Bi (৪টি α, ১টি β)।',
    controls: [['Z', 'মূল মৌলের Z', 80, 100, 1, 90, ''], ['A', 'মূল মৌলের A', 200, 250, 1, 228, ''], ['na', 'α কণার সংখ্যা', 0, 8, 1, 4, ''], ['nb', 'β কণার সংখ্যা', 0, 8, 1, 1, '']],
    legend: [['--b', 'α ধাপ'], ['--a', 'β ধাপ'], ['--d', 'শেষ নিউক্লাইড']],
    draw(w, h, t, p) {
      const steps = []; let Z = p.Z, A = p.A; steps.push([Z, A]);
      for (let i = 0; i < p.na; i++) { Z -= 2; A -= 4; steps.push([Z, A, 'α']); }
      for (let i = 0; i < p.nb; i++) { Z += 1; steps.push([Z, A, 'β']); }
      const gx0 = 40, gx1 = w - 16, gy0 = h - 26, gy1 = 16;
      axes(gx0, gy0, gx1, gy1, 'Z →', 'N = A − Z');
      const zs = steps.map((s) => s[0]), ns = steps.map((s) => s[1] - s[0]);
      const zmin = Math.min(...zs) - 2, zmax = Math.max(...zs) + 2, nmin = Math.min(...ns) - 3, nmax = Math.max(...ns) + 3;
      const X = (z) => gx0 + (z - zmin) / (zmax - zmin) * (gx1 - gx0), Y = (nn) => gy0 - (nn - nmin) / (nmax - nmin) * (gy0 - gy1);
      for (let i = 1; i < steps.length; i++) { const [z0, a0] = steps[i - 1], [z1, a1, k] = steps[i]; arrow(X(z0), Y(a0 - z0), X(z1), Y(a1 - z1), k === 'α' ? css('--b') : css('--a'), 2); }
      steps.forEach(([z, a], i) => { dot(X(z), Y(a - z), i === steps.length - 1 ? 6 : 3.5, i === steps.length - 1 ? css('--d') : css('--muted')); });
      const [z0, a0] = steps[0];
      text(`${SYM[z0 - 1]}-${a0}`, X(z0) + 6, Y(a0 - z0) - 6, css('--text'), 11);
      text(`${SYM[Z - 1] ?? '?'}-${A}`, X(Z) + 8, Y(A - Z) + 4, css('--d'), 12);
      const chk = (p.A - A) / 4, beta = Z + 2 * chk - p.Z;
      this.info = `<span class="big">${sup(p.A)}${SYM[p.Z - 1]} (Z = ${bn(p.Z, 0)}) → ${bn(p.na, 0)}α + ${bn(p.nb, 0)}β → ${sup(A)}${SYM[Z - 1] ?? '?'} (Z = ${bn(Z, 0)})</span><br>যাচাই: α = (${bn(p.A, 0)} − ${bn(A, 0)})/4 = ${bn(chk, 0)}; β = ${bn(Z, 0)} + 2×${bn(chk, 0)} − ${bn(p.Z, 0)} = ${bn(beta, 0)}। উপরের (ভর) ও নিচের (Z) সংখ্যার যোগফল দুই পাশে সমান থাকে।`;
    },
  });

  // ---------- runner ----------
  let cur = null, params = {}, btn = {}, t0 = performance.now(), paused = false;
  const $ = (id) => document.getElementById(id);
  $('tabs').innerHTML = S.map((s, i) => `<button data-i="${i}">${s.tab}</button>`).join('');
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) select(Number(b.dataset.i)); });

  function select(i) {
    cur = S[i];
    document.querySelectorAll('#tabs button').forEach((b, j) => b.classList.toggle('on', j === i));
    $('title').textContent = cur.title;
    $('sub').textContent = cur.sub;
    params = {}; btn = {};
    $('ctl').innerHTML = cur.controls.map(([k, label, min, max, step, val, unit]) => {
      params[k] = val;
      return `<label>${label}<b id="v_${k}">${bn(val, step < 0.01 ? 3 : step < 1 ? 2 : 0)} ${unit}</b><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-k="${k}" data-u="${unit}" data-s="${step}"></label>`;
    }).join('');
    $('buttons').innerHTML = `<button data-b="pause">${paused ? '▶ চালাও' : '⏸ থামাও'}</button>` + (cur.buttons ?? []).map(([k, label, on, isAction, group]) => {
      if (group) { if (on) btn[group] = k; } else if (!isAction) btn[k] = on;
      return `<button data-b="${k}" ${group ? `data-g="${group}"` : ''} ${isAction ? 'data-a="1"' : ''} class="${on ? 'on' : ''}">${label}</button>`;
    }).join('');
    $('legend').innerHTML = (cur.legend ?? []).map(([c, l]) => `<span><i style="background:var(${c})"></i>${l}</span>`).join('');
    $('note').textContent = cur.note ?? 'নোট: হিসাবগুলো নোটের সূত্র অনুযায়ী; ছবি ও রং বোঝানোর জন্য আনুমানিক।';
    cv.style.height = (cur.height ?? 260) + 'px';
    resize();
  }

  $('ctl').addEventListener('input', (e) => {
    const r = e.target; if (!r.dataset.k) return;
    params[r.dataset.k] = Number(r.value);
    const s = Number(r.dataset.s);
    $(`v_${r.dataset.k}`).textContent = `${bn(Number(r.value), s < 0.01 ? 3 : s < 1 ? 2 : 0)} ${r.dataset.u}`;
  });
  $('buttons').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.b;
    if (k === 'pause') { paused = !paused; b.textContent = paused ? '▶ চালাও' : '⏸ থামাও'; return; }
    if (b.dataset.a) { cur.action?.call(cur, k, params); return; }
    if (b.dataset.g) { btn[b.dataset.g] = k; document.querySelectorAll(`[data-g="${b.dataset.g}"]`).forEach((x) => x.classList.toggle('on', x === b)); return; }
    btn[k] = !btn[k]; b.classList.toggle('on', btn[k]);
  });

  let W = 0, H = 0, simT = 0, last = performance.now();
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!paused) simT += dt;
    if (cur) {
      ctx.clearRect(0, 0, W, H);
      cur.draw(W, H, simT, params, btn);
      $('info').innerHTML = cur.info ?? '';
    }
    requestAnimationFrame(frame);
  }
  select(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
